<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mini Sampler</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mini Sampler">
<meta name="theme-color" content="#F1F2F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<style>
/* Écran unique paysage : en-tête / temps / forme d'onde / défilement / pupitre */
:root{
  --bg:#F1F2F4; --panel:#FFFFFF; --ink:#1C1E23; --muted:#AEB2BA; --line:#DADDE2; --accent:#2F55E8;
  --tick:#8A8F99; --on:#E6EBFD; --scrim:rgba(20,22,26,.28);
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --font-num:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111317; --panel:#1A1D22; --ink:#ECEEF2; --muted:#4F5560; --line:#2B2F36; --accent:#7590FF;
  --tick:#6B717C; --on:#222A45; --scrim:rgba(0,0,0,.5); color-scheme:dark }}

html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:14px;
  overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,.ctl:focus-visible,label.icon:focus-within{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
[hidden]{display:none!important}

#app{height:100%;display:flex;flex-direction:column;gap:6px;
  padding-top:max(8px, env(safe-area-inset-top, 0px));padding-bottom:max(8px, env(safe-area-inset-bottom, 0px));
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

.top{display:flex;align-items:center;gap:10px;min-height:36px}
.file{flex:1;min-width:0}
.file-name{display:block;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:6px;align-items:center;flex:none}
.pill{font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;border:1.5px solid var(--line);background:var(--panel)}
.pill[aria-pressed="true"]{border-color:var(--accent);background:var(--on);color:var(--accent)}
.seg{display:flex;border:1.5px solid var(--line);border-radius:999px;background:var(--panel);overflow:hidden}
.seg button{font-size:12px;font-weight:600;padding:6px 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.io{display:flex;gap:4px;flex:none}
.icon{width:40px;height:36px;display:grid;place-items:center;cursor:pointer;border-radius:8px}
.icon svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2.6;stroke-linecap:square}
.visually-hidden{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.times{display:flex;gap:16px;align-items:baseline;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--tick);white-space:nowrap;overflow:hidden}
.times b{font-family:var(--font-num);font-weight:500;font-size:13px;letter-spacing:0;text-transform:none;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:4px}
.times .sp{flex:1}
.times .smp{font-family:var(--font-num);letter-spacing:0;text-transform:none;margin-left:4px}

.wave-wrap{flex:1;min-height:70px;position:relative}
#wave{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}

.scroll{position:relative;height:18px;touch-action:none;cursor:pointer}
.scroll::before{content:"";position:absolute;left:0;right:0;top:7px;height:4px;border-radius:2px;background:var(--line)}
.scroll-loop{position:absolute;top:7px;height:4px;background:var(--tick);border-radius:2px}
.thumb{position:absolute;top:3px;height:12px;border-radius:6px;background:var(--ink);min-width:18px}

.deck{display:flex;align-items:center;justify-content:center;gap:10px;height:96px;flex:none}
.side{display:flex;gap:8px;align-items:center}
.deck[data-mode="knob"] .side-end .coarse{order:2}
.deck[data-mode="bar"] .side{flex-direction:column;gap:6px}
.arrow{width:44px;height:72px;display:grid;place-items:center;border-radius:10px}
.arrow svg{width:22px;height:40px;stroke:var(--muted);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.arrow:active svg{stroke:var(--ink)}
#play{width:78px;height:78px;display:grid;place-items:center;border-radius:50%}
#play svg{width:78px;height:78px}
#play .ring{fill:none;stroke:var(--ink);stroke-width:2.2}
#play .sym{fill:var(--ink)}
#play .stop{display:none}
#play .loop{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
#play[aria-pressed="true"] .ring,#play[aria-pressed="true"] .loop{stroke:var(--accent)}
#play[aria-pressed="true"] .sym{fill:var(--accent)}
#play[aria-pressed="true"] .tri{display:none}
#play[aria-pressed="true"] .stop{display:block}

.ctl{touch-action:none;cursor:ew-resize;outline:none}
.knob{width:66px;height:66px;margin:0 auto}
.knob svg{width:100%;height:100%;display:block}
.knob .tk{stroke:var(--tick);stroke-width:3;stroke-linecap:round}
.knob .kb{fill:var(--panel);stroke:var(--ink);stroke-width:4}
.knob .ind line{stroke:var(--ink);stroke-width:4.5;stroke-linecap:round}
.ctl.coarse .kb,.ctl.coarse .ind line{stroke:var(--muted)}
.ctl.coarse .tk{stroke:var(--line)}
.ctl.on .kb,.ctl.on .ind line{stroke:var(--accent)}
.cap{text-align:center;font-size:10px;line-height:1.25;margin-top:2px}
.cap .nm{display:block;text-transform:uppercase;letter-spacing:.08em;color:var(--tick)}
.cap .st{display:block;font-family:var(--font-num);font-size:11px;color:var(--ink)}
.strip{display:none;position:relative;width:172px;height:38px;border-radius:9px;background:var(--panel);border:1.5px solid var(--line);overflow:hidden}
.strip-ticks{position:absolute;inset:8px 0;background-image:repeating-linear-gradient(90deg,var(--tick) 0 1.5px,transparent 1.5px 7px)}
.ctl.coarse .strip-ticks{opacity:.45}
.strip::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--ink)}
.strip-label{position:absolute;left:6px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:600;background:var(--panel);padding:2px 5px;border-radius:5px;z-index:1;white-space:nowrap}
.strip-label .st{font-family:var(--font-num);font-weight:500;margin-left:4px}
.ctl.on .strip{border-color:var(--accent)}
.ctl.on .strip::after{background:var(--accent)}
.deck[data-mode="bar"] .knob,.deck[data-mode="bar"] .cap{display:none}
.deck[data-mode="bar"] .strip{display:block}

/* Panneau d'export */
#scrim{position:fixed;inset:0;background:var(--scrim);z-index:15}
#exportPanel{position:fixed;z-index:16;top:calc(52px + env(safe-area-inset-top, 0px));right:max(16px, env(safe-area-inset-right, 0px));
  width:300px;max-width:calc(100vw - 32px);background:var(--panel);border:1.5px solid var(--line);border-radius:14px;padding:14px;
  display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
#exportPanel h2{font-size:15px;margin:0}
.meta{font-family:var(--font-num);font-size:12px;color:var(--tick)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;padding:2px 0}
.opt small{display:block;color:var(--tick);font-size:11px}
.sw{position:relative;width:46px;height:28px;border-radius:14px;background:var(--line);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.share{background:var(--ink);color:var(--bg);font-weight:700;border-radius:10px;padding:11px;font-size:14px}

#toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);font-size:13px;padding:8px 14px;border-radius:10px;max-width:80vw;text-align:center;z-index:20}
#rotate{display:none;position:fixed;inset:0;z-index:30;background:var(--bg);place-items:center;text-align:center;padding:24px}
#rotate p{font-weight:600;font-size:18px;margin:12px 0 4px}
#rotate small{color:var(--tick);font-size:13px}
#rotate svg{width:64px;height:64px;stroke:var(--ink);fill:none;stroke-width:2.5}
@media (orientation: portrait) and (max-width: 700px){ #rotate{display:grid} }
@media (max-width: 760px){ .pill,.seg button{padding:6px 8px} .times{gap:10px} }
@media (prefers-reduced-motion: reduce){ .sw,.sw::after{transition:none} }
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="file"><span class="file-name" id="fileName">Chargement…</span></div>
    <div class="pills">
      <button class="pill" id="btnFrame" type="button">Cadrer</button>
      <button class="pill" id="btnPrec" type="button" aria-pressed="false">Précision</button>
      <button class="pill" id="btnSnap" type="button" aria-pressed="true">Anti-clic</button>
      <div class="seg" role="group" aria-label="Type de commandes">
        <button id="modeKnob" type="button" aria-pressed="true">Potards</button>
        <button id="modeBar" type="button" aria-pressed="false">Barres</button>
      </div>
    </div>
    <div class="io">
      <label class="icon" title="Importer un son" aria-label="Importer un son">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M3 13v8h18v-8"/></svg>
        <input class="visually-hidden" type="file" id="fileInput" accept="audio/*,.mp3,.wav,.wave">
      </label>
      <button class="icon" id="btnExport" type="button" title="Exporter le WAV" aria-label="Exporter le WAV">
        <svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M3 13v8h18v-8"/></svg>
      </button>
    </div>
  </header>

  <div class="times">
    <span>Début<b id="tStart">0:00.000</b></span>
    <span>Fin<b id="tEnd">0:00.000</b></span>
    <span>Boucle<b id="tLen">0.000 s</b><span class="smp" id="tSmp"></span></span>
    <span class="sp"></span>
    <span>Lecture<b id="tPos">–:––.–––</b></span>
  </div>

  <div class="wave-wrap"><canvas id="wave" aria-label="Forme d'onde : glisser les repères, pincer pour zoomer"></canvas></div>

  <div class="scroll" id="scroll" aria-label="Se déplacer dans le morceau">
    <div class="scroll-loop" id="scrollLoop"></div>
    <div class="thumb" id="thumb"></div>
  </div>

  <div class="deck" id="deck" data-mode="knob">
    <div class="side side-start" id="sideStart"></div>
    <button class="arrow" id="shiftL" type="button" aria-label="Décaler la boucle vers la gauche"><svg viewBox="0 0 22 40"><path d="M19 3L3 20l16 17"/></svg></button>
    <button id="play" type="button" aria-pressed="false" aria-label="Lecture en boucle / arrêt">
      <svg viewBox="0 0 78 78">
        <circle class="ring" cx="39" cy="39" r="30"/>
        <path class="loop" d="M39 4.5a34.5 34.5 0 0 1 24 9.8"/><path class="loop" d="M57.5 9.5l6 4.8-6.8 3.6"/>
        <path class="sym tri" d="M32 26.5v25l20-12.5z"/>
        <rect class="sym stop" x="29" y="29" width="20" height="20" rx="2"/>
      </svg>
    </button>
    <button class="arrow" id="shiftR" type="button" aria-label="Décaler la boucle vers la droite"><svg viewBox="0 0 22 40"><path d="M3 3l16 17L3 37"/></svg></button>
    <div class="side side-end" id="sideEnd"></div>
  </div>
</div>

<div id="scrim" hidden></div>
<div id="exportPanel" role="dialog" aria-label="Exporter le sample" hidden>
  <h2>Exporter le sample</h2>
  <div class="meta" id="exMeta"></div>
  <div class="opt"><span>Fondu début / fin<small>5 ms, évite les clics</small></span><button class="sw" id="swFade" type="button" role="switch" aria-checked="true" aria-label="Fondu début et fin"></button></div>
  <div class="opt"><span>Normaliser<small>Volume au maximum sans saturer</small></span><button class="sw" id="swNorm" type="button" role="switch" aria-checked="true" aria-label="Normaliser"></button></div>
  <button class="share" id="btnShare" type="button">Partager le WAV</button>
</div>

<div id="toast" hidden></div>
<div id="rotate"><div>
  <svg viewBox="0 0 64 64"><rect x="20" y="6" width="24" height="44" rx="4"/><path d="M10 40a24 24 0 0 0 30 18M34 56l6 2-2 6"/></svg>
  <p>Tourne ton iPhone</p><small>Mini Sampler s'utilise en paysage.<br>Pense à désactiver le verrou de rotation.</small>
</div></div>

<script>
(() => {
'use strict';
const $ = (id) => document.getElementById(id);
const AC = window.AudioContext || window.webkitAudioContext;
const OAC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
let ctx;
try { ctx = new AC({ latencyHint: 'interactive' }); } catch (e) { ctx = new AC(); }

const MIN_LOOP = 16;          // échantillons
const PX = 7;                 // pixels de glisser par cran (validé au test)
const MAX_SEC = 12 * 60;
const FADE_SEC = 0.005;
const NORM_PEAK = 0.989;      // ≈ -0,1 dBFS

const S = {
  buf: null, sr: 44100, len: 0, L: null, R: null, levels: [], gmax: 1, name: '', isDemo: false,
  start: 0, end: 0, vs: 0, ve: 1,
  prec: false, snap: true, mode: 'knob', fade: true, norm: true,
  src: null, gain: null, pos: 0, lastCt: 0, dirty: true,
  dragMarker: null, wav: null
};

/* ---------- Déblocage audio iOS ---------- */
const unlock = () => { if (ctx.state !== 'running') ctx.resume().catch(() => {}); };
['touchend', 'pointerup', 'keydown'].forEach(t => document.addEventListener(t, unlock, { passive: true }));

/* ---------- Mémoire de session (IndexedDB, sur l'iPhone uniquement) ---------- */
const store = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('mini-sampler', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
  const tx = (mode, fn) => open().then(db => new Promise((res, rej) => {
    const t = db.transaction('kv', mode), st = t.objectStore('kv'), out = fn(st);
    t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error);
  }));
  return {
    get: (k) => tx('readonly', st => st.get(k)).catch(() => null),
    set: (k, v) => tx('readwrite', st => { st.put(v, k); }).catch(() => {})
  };
})();
let saveT = 0;
function saveState() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    store.set('state', { start: S.start, end: S.end, vs: S.vs, ve: S.ve, prec: S.prec, snap: S.snap,
                         mode: S.mode, fade: S.fade, norm: S.norm, isDemo: S.isDemo });
  }, 400);
}

/* ---------- Son de démonstration ---------- */
function makeDemo() {
  const sr = 44100, beat = 0.6, bars = 12;
  const n = Math.ceil(bars * 4 * beat * sr);
  const buf = ctx.createBuffer(2, n, sr);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let seed = 7;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 2147483648 - 1; };
  const add = (i, l, r) => { if (i >= 0 && i < n) { L[i] += l; R[i] += r; } };
  const roots = [55, 43.65, 65.41, 49];
  for (let b = 0; b < bars; b++) {
    const full = b >= 2 && b < 10, brk = b >= 10;
    for (let q = 0; q < 4; q++) {
      const t0 = Math.round((b * 4 + q) * beat * sr);
      if (full || (brk && q === 0)) {
        let ph = 0;
        for (let k = 0, kl = 0.4 * sr; k < kl; k++) {
          const t = k / sr; ph += 2 * Math.PI * (45 + 110 * Math.exp(-t * 28)) / sr;
          const v = Math.sin(ph) * Math.exp(-t * 7) * 0.85; add(t0 + k, v, v);
        }
      }
      if (full && (q === 1 || q === 3)) {
        for (let k = 0, kl = 0.25 * sr; k < kl; k++) {
          const t = k / sr;
          const v = rnd() * Math.exp(-t * 16) * 0.32 + Math.sin(2 * Math.PI * 185 * t) * Math.exp(-t * 25) * 0.22;
          add(t0 + k, v, v);
        }
      }
    }
    if (!brk) for (let e = 0; e < 8; e++) {
      const t0 = Math.round((b * 4 + e / 2) * beat * sr);
      const open = e % 2 === 1, a = b < 2 ? 0.12 : 0.2;
      let prev = 0;
      for (let k = 0, kl = (open ? 0.15 : 0.05) * sr; k < kl; k++) {
        const t = k / sr, r = rnd(), v = (r - prev) * 0.5 * a * Math.exp(-t * (open ? 25 : 70)); prev = r;
        add(t0 + k, v * 0.7, v);
      }
    }
    if (b >= 2) for (let e = 0; e < 8; e++) {
      const f = roots[b % 4], t0 = Math.round((b * 4 + e / 2) * beat * sr);
      for (let k = 0, kl = beat / 2 * 0.9 * sr; k < kl; k++) {
        const t = k / sr;
        const v = (2 / Math.PI) * Math.asin(Math.sin(2 * Math.PI * f * t)) * Math.min(1, t * 300) * Math.exp(-t * 4) * 0.32;
        add(t0 + k, v, v);
      }
    }
  }
  for (let i = 0; i < n; i++) { L[i] = Math.tanh(L[i]); R[i] = Math.tanh(R[i]); }
  return buf;
}

/* ---------- Chargement et pyramide de crêtes (calculée une seule fois) ---------- */
function loadBuffer(buf, name, loopStart, loopEnd) {
  stop();
  S.buf = buf; S.sr = buf.sampleRate; S.len = buf.length; S.name = name; S.wav = null;
  S.L = buf.getChannelData(0); S.R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
  buildPeaks();
  S.start = Math.max(0, Math.min(loopStart, S.len - MIN_LOOP));
  S.end = Math.max(S.start + MIN_LOOP, Math.min(loopEnd, S.len));
  S.vs = 0; S.ve = S.len;
  $('fileName').textContent = name;
  updateTimes(); updateLabels(); clampView(); S.dirty = true;
}
function buildPeaks() {
  const B0 = 64, len = S.len, L = S.L, R = S.R;
  const n0 = Math.ceil(len / B0), p0 = new Float32Array(n0);
  for (let b = 0; b < n0; b++) {
    const a = b * B0, e = Math.min(len, a + B0); let m = 0;
    if (R) for (let i = a; i < e; i++) { const v = Math.abs(L[i] + R[i]) * 0.5; if (v > m) m = v; }
    else for (let i = a; i < e; i++) { const v = Math.abs(L[i]); if (v > m) m = v; }
    p0[b] = m;
  }
  S.levels = [{ size: B0, data: p0 }];
  while (S.levels[S.levels.length - 1].data.length > 64) {
    const prev = S.levels[S.levels.length - 1], pd = prev.data, n = Math.ceil(pd.length / 4), d = new Float32Array(n);
    for (let i = 0; i < n; i++) { let m = 0; for (let j = i * 4, e = Math.min(pd.length, j + 4); j < e; j++) if (pd[j] > m) m = pd[j]; d[i] = m; }
    S.levels.push({ size: prev.size * 4, data: d });
  }
  let g = 0; for (const v of S.levels[S.levels.length - 1].data) if (v > g) g = v;
  S.gmax = Math.max(g, 1e-4);
}
const val = (i) => S.R ? (S.L[i] + S.R[i]) * 0.5 : S.L[i];
function peak(a, b) {
  a = Math.max(0, a); b = Math.min(S.len, b);
  if (b <= a) return 0;
  const span = b - a; let m = 0;
  if (span <= 256) { for (let i = a; i < b; i++) { const v = Math.abs(val(i)); if (v > m) m = v; } return m; }
  let lv = S.levels[0];
  for (const l of S.levels) { if (l.size * 4 <= span) lv = l; else break; }
  const d = lv.data, i0 = Math.floor(a / lv.size), i1 = Math.min(d.length, Math.ceil(b / lv.size));
  for (let i = i0; i < i1; i++) if (d[i] > m) m = d[i];
  return m;
}

/* ---------- Passage à zéro ---------- */
const crosses = (i) => i > 0 && i < S.len && ((val(i - 1) < 0) !== (val(i) < 0));
function nearestZero(t, win) {
  for (let d = 0; d <= win; d++) {
    if (crosses(t - d)) return t - d;
    if (crosses(t + d)) return t + d;
  }
  return null;
}
function nextZero(from, dir, max) {
  for (let i = from + dir, k = 0; i > 0 && i < S.len && k < max; i += dir, k++) if (crosses(i)) return i;
  return null;
}

/* ---------- Repères ---------- */
function setMarker(which, t) {
  t = Math.round(t);
  if (which === 'start') t = Math.min(Math.max(0, t), S.end - MIN_LOOP);

$('swFade').addEventListener('click', () => { S.fade = !S.fade; setSwitch('swFade', S.fade); renderWav(); saveState(); });
$('swNorm').addEventListener('click', () => { S.norm = !S.norm; setSwitch('swNorm', S.norm); renderWav(); saveState(); });
$('btnShare').addEventListener('click', () => {
  if (!S.wav) renderWav();
  const file = new File([S.wav.blob], S.wav.name, { type: 'audio/wav' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file] }).then(() => { closeExport(); }).catch((err) => {
      if (err && err.name === 'AbortError') return;
      download();
    });
  } else download();
});
function download() {
  const url = URL.createObjectURL(S.wav.blob), a = document.createElement('a');
  a.href = url; a.download = S.wav.name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
  closeExport(); toast('WAV enregistré : ' + S.wav.name);
}

/* ---------- Import ---------- */
function sniffRate(ab) {
  const b = new Uint8Array(ab), dv = new DataView(ab);
  const tag = (o) => String.fromCharCode(b[o], b[o + 1], b[o + 2], b[o + 3]);
  if (b.length > 44 && tag(0) === 'RIFF' && tag(8) === 'WAVE') {
    let p = 12;
    while (p + 8 <= b.length) {
      const id = tag(p), size = dv.getUint32(p + 4, true);
      if (id === 'fmt ') return dv.getUint32(p + 12, true);
      p += 8 + size + (size & 1);
    }
    return 0;
  }
  let p = 0;
  if (b.length > 10 && b[0] === 0x49 && b[1] === 0x44 && b[2] === 0x33) {
    p = 10 + ((b[6] & 0x7f) << 21 | (b[7] & 0x7f) << 14 | (b[8] & 0x7f) << 7 | (b[9] & 0x7f));
    if (b[5] & 0x10) p += 10;
  }
  const tbl = { 3: [44100, 48000, 32000], 2: [22050, 24000, 16000], 0: [11025, 12000, 8000] };
  for (let end = Math.min(b.length - 4, p + 65536); p < end; p++) {
    if (b[p] !== 0xff || (b[p + 1] & 0xe0) !== 0xe0) continue;
    const ver = (b[p + 1] >> 3) & 3, layer = (b[p + 1] >> 1) & 3, br = b[p + 2] >> 4, si = (b[p + 2] >> 2) & 3;
    if (ver === 1 || layer === 0 || br === 15 || si === 3) continue;
    return tbl[ver][si];
  }
  return 0;
}
function decodeWith(c, ab) {
  return new Promise((res, rej) => {
    const p = c.decodeAudioData(ab, res, rej);
    if (p && p.then) p.then(res, rej);
  });
}
async function decodeFile(ab) {
  const rate = sniffRate(ab);
  if (rate && OAC) {                                 // décodage à la fréquence d'origine du fichier
    try { return await decodeWith(new OAC(1, 1, rate), ab.slice(0)); } catch (e) { /* repli ci-dessous */ }
  }
  return decodeWith(ctx, ab);
}
async function importFile(f) {
  toast('Chargement de « ' + f.name + ' »…', 60000);
  try {
    const ab = await f.arrayBuffer();
    const buf = await decodeFile(ab.slice(0));
    if (buf.duration > MAX_SEC) {
      const m = Math.floor(buf.duration / 60), s = Math.round(buf.duration % 60);
      toast(`Fichier trop long (${m} min ${s} s). Maximum : 12 minutes.`); return;
    }
    S.isDemo = false;
    loadBuffer(buf, f.name, 0, buf.length);
    toast('');
    store.set('file', { name: f.name, type: f.type, data: ab });
    saveState();
  } catch (err) {
    toast('Ce fichier ne peut pas être lu. Formats acceptés : MP3 et WAV.');
  }
}
$('fileInput').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (f) importFile(f);
});

/* ---------- Divers ---------- */
let toastT = 0;
function toast(msg, ms = 2600) {
  const el = $('toast'); clearTimeout(toastT);
  if (!msg) { el.hidden = true; return; }
  el.textContent = msg; el.hidden = false;
  toastT = setTimeout(() => { el.hidden = true; }, ms);
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { stop(); saveState(); } });
window.addEventListener('pagehide', stop);

/* ---------- Démarrage : dernière session, sinon démo ---------- */
async function boot() {
  resize();
  requestAnimationFrame(frame);
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  const [file, st] = await Promise.all([store.get('file'), store.get('state')]);
  if (st) {
    setPrec(!!st.prec); setSnap(st.snap !== false); setMode(st.mode === 'bar' ? 'bar' : 'knob');
    S.fade = st.fade !== false; S.norm = st.norm !== false;
  }
  setSwitch('swFade', S.fade); setSwitch('swNorm', S.norm);
  if (file && file.data && !(st && st.isDemo)) {
    try {
      const buf = await decodeFile(file.data.slice(0));
      S.isDemo = false;
      loadBuffer(buf, file.name, st ? st.start : 0, st ? st.end : buf.length);
      if (st && st.ve > st.vs) { S.vs = st.vs; S.ve = st.ve; clampView(); }
      return;
    } catch (e) { /* fichier illisible : on repart sur la démo */ }
  }
  const demo = makeDemo(), sr = demo.sampleRate;
  S.isDemo = true;
  loadBuffer(demo, 'Démo · boucle 100 BPM', Math.round(4.8 * sr), Math.round(7.2 * sr));
}
boot();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
